services:
  - type: web
    name: student-management-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app"

databases:
  - name: student-management-db
    databaseName: student_management
    user: student_user
    plan: free
